[build-system]
requires = ["setuptools>=68", "wheel>=0.41"]
build-backend = "setuptools.build_meta"

[project]
name = "semantist"
version = "0.1.0"
description = "Semantic-guided fuzzing for IEC 61131-3 Structured Text"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
semantist = "fuzzer.pipeline.core:main"
semantist-report = "fuzzer.reporting.report:main"
semantist-minimize = "fuzzer.cli.minimize_seed:main"
semantist-compile = "compiler.instrumentation.compile:compile_st_project_main"
semantist-prepare-ir = "compiler.instrumentation.compile:prepare_target_ir_main"
semantist-harness = "compiler.harness.generator:main"
semantist-batch = "fuzzer.cli.batch:main"
semantist-experiment = "fuzzer.cli.experiment:main"
semantist-replay = "fuzzer.pipeline.replay:main"
semantist-llm-check = "fuzzer.llm.check:main"
semantist-timer-probe = "fuzzer.cli.timer_probe:main"
semantist-mutation-short = "fuzzer.cli.mutation_short:main"

[tool.setuptools.packages.find]
include = ["compiler*", "fuzzer*"]

[tool.setuptools.package-data]
"compiler.toolchain.compatibility" = [
  "README.md",
  "profiles/*/*.json",
  "profiles/*/*.st",
  "profiles/*/*.c",
  "profiles/*/*.cc",
  "profiles/*/*.cpp",
]
# These files are loaded by the installed Python entry points through the
# package directory (the symbolic builder, intake normalizer, and native
# harness all need them at runtime).  Keep source benchmarks and external
# Rusty/Cargo artifacts out of the wheel; those remain explicit environment
# inputs for a build.
"compiler.symbolic" = ["models/*.c", "models/*.md"]
"compiler.instrumentation" = ["runtime/*.c", "runtime/*.h"]
"compiler.intake" = [
  "normalize/legacy.json",
  "normalize/dialects/*.json",
  "normalize/libraries/*.json",
  "normalize/probes/*/*.json",
  "normalize/probes/*/*.st",
  "extract/*.json",
  "extract/*.md",
  "stubs/library/*.json",
]
"compiler.parser" = [
  "st-to-rusty-converter/SKILL.md",
  "st-to-rusty-converter/agents/*.yaml",
  "st-to-rusty-converter/references/*.md",
]
"compiler.toolchain" = [
  "rusty-patches/*.patch",
  "rusty-test-backports/*.patch",
  "stdlib-patches/*.patch",
]
"compiler.scripts" = ["*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
