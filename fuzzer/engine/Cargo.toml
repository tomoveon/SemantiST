[package]
name = "semantist"
version.workspace = true
edition.workspace = true

# The in-process fuzzer library; the forkserver engine is the `semantist` binary.
[lib]
name = "semantist_inprocess"
path = "src/lib.rs"
crate-type = ["staticlib"]
test = false

[[bin]]
name = "semantist"
path = "src/main.rs"

[dependencies]
libafl = "0.15.4"
libafl_bolts = "0.15.4"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
