[package]
name = "semantist"
version.workspace = true
edition.workspace = true

# The single in-process fuzzer library used by the campaign pipeline.
[lib]
name = "semantist_inprocess"
path = "src/lib.rs"
crate-type = ["staticlib"]

[dependencies]
libafl = "0.15.4"
libafl_bolts = "0.15.4"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
bincode = { version = "2.0.1", features = ["serde"] }
libc = "0.2"
